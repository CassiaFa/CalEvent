# Memory and CPU kept low on purpose: the dev laptop (8 cores, 15 GB shared with the editor) froze when
# several builds ran at once. One Gradle JVM, Kotlin compiled inside it (no separate Kotlin daemon),
# few workers, and the daemon stops itself after 10 idle minutes.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=3
org.gradle.parallel=false
org.gradle.daemon.idletimeout=600000
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
